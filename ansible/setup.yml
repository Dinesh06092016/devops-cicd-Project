---
- name: Setup EC2 instances for Kubernetes
  hosts: all
  become: yes

  tasks:
    - name: Gather facts
      ansible.builtin.setup:

    - name: Remove old Kubernetes repo if exists
      ansible.builtin.file:
        path: /etc/yum.repos.d/kubernetes.repo
        state: absent

    - name: Ensure system is updated (skip broken repos)
      ansible.builtin.yum:
        name: '*'
        state: latest
        skip_broken: yes

    - name: Install required packages
      ansible.builtin.yum:
        name:
          - curl
          - wget
          - vim
          - git
          - bash-completion
        state: present

    - name: Enable Kubernetes via amazon-linux-extras
      ansible.builtin.shell: amazon-linux-extras enable kubernetes1.27
      args:
           - name: Install Kubernetes packages
      ansible.builtin.yum:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present

    - name: Enable and start kubelet service
      ansible.builtin.service:
        name: kubelet
        state: started
        enabled: true
