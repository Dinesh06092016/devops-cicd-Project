---
- name: Setup EC2 instances for Kubernetes
  hosts: all
  become: yes
  tasks:

    - name: Gather facts
      ansible.builtin.setup:

    - name: Ensure system is updated (skip broken repos)
      ansible.builtin.yum:
        name: "*"
        state: latest
        disable_gpg_check: yes
        update_cache: yes
      ignore_errors: yes

    - name: Install required packages
      ansible.builtin.yum:
        name:
          - curl
          - wget
          - vim
          - git
          - yum-utils
          - device-mapper-persistent-data
          - lvm2
        state: present

    - name: Add Kubernetes repo for Amazon Linux 2 (EL8)
      ansible.builtin.yum_repository:
        name: kubernetes
        description: Kubernetes repository
        baseurl: https://packages.cloud.google.com/yum/repos/kubernetes-el8-x86_64
        enabled: yes
        gpgcheck: yes
        repo_gpgcheck: yes
        gpgkey:
          - https://packages.cloud.google.com/yum/doc/yum-key.gpg
          - https://packages.cloud.google.com/yum/doc/rpm-package-key.gpg

    - name: Refresh yum cache after adding Kubernetes repo
      ansible.builtin.yum:
        name: "*"
        state: latest
        update_cache: yes

    - name: Set SELinux in permissive mode (if present)
      ansible.builtin.command: setenforce 0
      ignore_errors: yes

    - name: Disable swap
      ansible.builtin.command: swapoff -a
      ignore_errors: yes

    - name: Install Kubernetes components
      ansible.builtin.yum:
        name:
          - kubelet-1.27.6-0
          - kubeadm-1.27.6-0
          - kubectl-1.27.6-0
        state: present
        disable_gpg_check: yes

    - name: Reload systemd and enable kubelet
      ansible.builtin.systemd:
        name: kubelet
        enabled: yes
        state: starte
