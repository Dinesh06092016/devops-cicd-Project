- hosts: all
  become: yes
  tasks:
    - name: Install dependencies
      yum:
        name: "{{ item }}"
        state: present
        update_cache: yes
      loop:
        - docker.io
        - yum-transport-https
        - curl

    - name: Install Kubernetes packages
      shell: |
        curl -s https://packages.cloud.google.com/yum/doc/apt-key.gpg | yum-key add -
        echo "deb https://yum.kubernetes.io/ kubernetes-xenial main" | tee /etc/yum/sources.list.d/kubernetes.list
        yum update
        yum install -y kubelet kubeadm kubectl
