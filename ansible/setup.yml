---
- name: Setup EC2 instances
  hosts: all
  become: true
  vars:
    ansible_python_interpreter: /usr/bin/python3

  tasks:
    - name: Update all packages
      ansible.builtin.yum:
        name: "*"
        state: latest

    - name: Install required packages
      ansible.builtin.yum:
        name:
          - python3
          - python3-pip
          - git
        state: present

    - name: Ensure pip packages are installed
      ansible.builtin.pip:
        name:
          - flask
          - boto3
        state: present

    - name: Deploy application code (copy from Jenkins workspace)
      ansible.builtin.copy:
        src: /var/lib/jenkins/workspace/devops-cicd-pipeline/app/
        dest: /home/ubuntu/app/
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Run the Flask app (example)
      ansible.builtin.shell: |
        pkill -f app.py || true
        nohup python3 /home/ubuntu/app/app.py &
      args:
        executable: /bin/bash
