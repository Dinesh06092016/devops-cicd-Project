---
- name: Setup EC2 instances for Kubernetes
  hosts: all
  become: yes
  vars:
    docker_version: "20.10"

  tasks:
    - name: Ensure system is updated (skip broken repos)
      yum:
        name: "*"
        state: latest
        disable_repo:
          - kubernetes  # skip Kubernetes repo during full system update

    - name: Install required packages
      yum:
        name:
          - yum-utils
          - device-mapper-persistent-data
          - lvm2
          - git
        state: present

    - name: Add Docker repository
      yum_repository:
        name: docker
        description: Docker CE Stable - x86_64
        baseurl: https://download.docker.com/linux/centos/7/x86_64/stable
        gpgcheck: yes
        gpgkey: https://download.docker.com/linux/centos/gpg
        state: present

    - name: Install Docker
      yum:
        name: "docker-ce-{{ docker_version }}*"
        state: present

    - name: Enable and start Docker
      systemd:
        name: docker
        enabled: yes
        state: started

    - name: Add Kubernetes repository
      yum_repository:
        name: kubernetes
        description: Kubernetes
        baseurl: https://packages.cloud.google.com/yum/repos/kubernetes-el7-x86_64
        gpgcheck: yes
        repo_gpgcheck: yes
        gpgkey:
          - https://packages.cloud.google.com/yum/doc/yum-key.gpg
          - https://packages.cloud.google.com/yum/doc/rpm-package-key.gpg
        state: present

    - name: Install Kubernetes components
      yum:
        name:
          - kubeadm
          - kubelet
          - kubectl
        state: present
        enablerepo: kubernetes

    - name: Enable and start kubelet
      systemd:
        name: kubelet
        enabled: yes
        state: started

    - name: Disable SELinux temporarily
      command: setenforce 0
      ignore_errors: yes

    - name: Disable swap
      command: swapoff -a

    - name: Persist swap off in /etc/fstab
      lineinfile:
        path: /etc/fstab
        regexp: 'swap'
        state: absent
