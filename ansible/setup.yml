---
- name: Setup Kubernetes cluster and deploy Flask app
  hosts: all
  become: yes
  tasks:

    - name: Update all packages
      amazon.aws.aws_ssm:
        name: dummy   # placeholder if needed
      ansible.builtin.yum:
        name: "*"
        state: latest

    - name: Install required packages
      yum:
        name:
          - git
          - python3
          - python3-pip
          - curl
          - vim
        state: present

    - name: Install Docker
      amazon.aws.package:
        name: docker
        state: present

    - name: Start and enable Docker service
      service:
        name: docker
        state: started
        enabled: true

    - name: Add user to docker group
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes

    - name: Pull latest Flask Docker image
      docker_image:
        name: dinesh06092016/flask-app
        source: pull
        tag: latest

    - name: Run Flask app container
      docker_container:
        name: flask-app
        image: dinesh06092016/flask-app:latest
        state: started
        restart_policy: always
        ports:
          - "5000:5000"
