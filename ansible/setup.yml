---
- name: Setup EC2 instances
  hosts: all
  become: yes

  tasks:
    - name: Update all packages
      ansible.builtin.yum:
        name: "*"
        state: latest

    - name: Install required utilities
      ansible.builtin.yum:
        name:
          - git
          - curl
          - wget
          - unzip
        state: present

    - name: Enable Docker on Amazon Linux 2
      ansible.builtin.shell: amazon-linux-extras enable docker
      args:
        warn: false

    - name: Install Docker
      ansible.builtin.yum:
        name: docker
        state: present

    - name: Start and enable Docker service
      ansible.builtin.service:
        name: docker
        state: started
        enabled: yes

    - name: Add ec2-user to docker group
      ansible.builtin.user:
        name: ec2-user
        groups: docker
        append: yes

    - name: Install Python3 pip (if not installed)
      ansible.builtin.yum:
        name: python3-pip
        state: present

    - name: Upgrade pip
      ansible.builtin.pip:
        name: pip
        state: latest
