---
- hosts: all
  become: yes
  tasks:

    - name: Gather facts
      ansible.builtin.setup:

    - name: Remove old Kubernetes repo if exists
      ansible.builtin.file:
        path: /etc/yum.repos.d/kubernetes.repo
        state: absent

    - name: Ensure system is updated (skip broken repos)
      ansible.builtin.yum:
        name: "*"
        state: latest
        skip_broken: yes

    - name: Install required packages
      ansible.builtin.yum:
        name:
          - yum-utils
          - device-mapper-persistent-data
          - lvm2
          - curl
        state: present

    - name: Enable Kubernetes via amazon-linux-extras
      ansible.builtin.shell:
        cmd: "amazon-linux-extras enable kubernetes1.27"
        warn: false

    - name: Refresh yum cache
      ansible.builtin.shell:
        cmd: "yum makecache"
        warn: false

    - name: Install Kubernetes packages
      ansible.builtin.yum:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present
        disable_gpg_check: yes

    - name: Enable and start kubelet
      ansible.builtin.systemd:
        name: kubelet
        enabled: yes
        state: started
