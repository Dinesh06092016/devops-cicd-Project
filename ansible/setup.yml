---
- name: Setup Kubernetes nodes on Amazon Linux
  hosts: all
  become: yes

  tasks:
    - name: Update yum and install dependencies
      yum:
        name:
          - git
          - curl
          - wget
          - unzip
        state: present
        update_cache: yes

    - name: Install Docker on Amazon Linux 2
      shell: |
        amazon-linux-extras install docker -y
        systemctl enable docker
        systemctl start docker

    - name: Add ec2-user to Docker group
      user:
        name: ec2-user
        groups: docker
        append: yes

    - name: Install Kubernetes tools (kubectl, kubeadm, kubelet)
      shell: |
        cat <<EOF > /etc/yum.repos.d/kubernetes.repo
        [kubernetes]
        name=Kubernetes
        baseurl=https://pkgs.k8s.io/core:/stable:/v1.30/rpm/
        enabled=1
        gpgcheck=1
        gpgkey=https://pkgs.k8s.io/core:/stable:/v1.30/rpm/repodata/repomd.xml.key
        exclude=kubelet kubeadm kubectl cri-tools kubernetes-cni
        EOF
        yum install -y kubelet kubeadm kubectl --disableexcludes=kubernetes
        systemctl enable kubelet
        systemctl start kubelet

    - name: Verify Docker and Kubernetes installation
      shell: |
        docker --version
        kubeadm version
        kubectl version --client
      register: verify_output

    - debug:
        msg: "{{ verify_output.stdout_lines }}"
