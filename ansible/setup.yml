---
- name: Setup Kubernetes cluster and deploy Flask app
  hosts: all
  become: yes
  vars:
    pod_network_cidr: "10.244.0.0/16"   # Flannel default
    flask_app_image: "dinesh06092016/flask-app:latest"

  tasks:
    - name: Update yum and install dependencies
      yum:
        name:
          - git
          - curl
          - wget
          - unzip
        state: present
        update_cache: yes

    - name: Install Docker
      shell: |
        amazon-linux-extras enable docker
        yum install -y docker
        systemctl enable docker
        systemctl start docker

    - name: Add ec2-user to Docker group
      user:
        name: ec2-user
        groups: docker
        append: yes

    - name: Install Kubernetes repository
      yum_repository:
        name: kubernetes
        description: Kubernetes Repo
        baseurl: https://packages.cloud.google.com/yum/repos/kubernetes-el7-x86_64
        gpgcheck: yes
        repo_gpgcheck: yes
        gpgkey: 
          - https://packages.cloud.google.com/yum/doc/yum-key.gpg
          - https://packages.cloud.google.com/yum/doc/rpm-package-key.gpg
        enabled: yes

    - name: Install Kubernetes tools
      yum:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present
        disable_excludes: kubernetes

    - name: Enable and start kubelet
      systemd:
        name: kubelet
        enabled: yes
        state: started

- name: Initialize Kubernetes master node
  hosts: master
  become: yes
  tasks:
    - name: Initialize the cluster
      command: kubeadm init --pod-network-cidr={{ pod_network_cidr }}
      args:
        creates: /etc/kubernetes/admin.conf
      register: kubeadm_init

    - name: Set up kubeconfig for ec2-user
      shell: |
        mkdir -p /home/ec2-user/.kube
        cp -i /etc/kubernetes/admin.conf /home/ec2-user/.kube/config
        chown ec2-user:ec2-user /home/ec2-user/.kube/config

    - name: Install Flannel network
      shell: kubectl apply -f https://raw.githubusercontent.com/flannel-io/flannel/master/Documentation/kube-flannel.yml
      environment:
        KUBECONFIG: /home/ec2-user/.kube/config

    - name: Get join command for workers
      command: kubeadm token create --print-join-command
      register: join_cmd

    - name: Save join command for worker nodes
      copy:
        content: "{{ join_cmd.stdout }}"
        dest: /home/ec2-user/kube_join.sh
        mode: '0755'

- name: Join worker nodes to cluster
  hosts: workers
  become: yes
  tasks:
    - name: Copy join script from master
      fetch:
        src: /home/ec2-user/kube_join.sh
        dest: /tmp/kube_join.sh
        flat: yes
      delegate_to: "{{ groups['master'][0] }}"

    - name: Join node to Kubernetes cluster
      shell: sh /tmp/kube_join.sh

- name: Deploy Flask app to Kubernetes
  hosts: master
  become: yes
  tasks:
    - name: Create Kubernetes deployment for Flask app
      shell: |
        kubectl apply -f - <<EOF
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: flask-app
        spec:
          replicas: 1
          selector:
            matchLabels:
              app: flask-app
          template:
            metadata:
              labels:
                app: flask-app
            spec:
              containers:
              - name: flask-app
                image: {{ flask_app_image }}
                ports:
                - containerPort: 5000
        EOF
      environment:
        KUBECONFIG: /home/ec2-user/.kube/config

    - name: Expose Flask app via NodePort
      shell: |
        kubectl expose deployment flask-app --type=NodePort --name=flask-service --port=5000 --target-port=5000
      environment:
        KUBECONFIG: /home/ec2-user/.kube/config

    - name: Show service details
      shell: kubectl get svc flask-service -o wide
      environment:
        KUBECONFIG: /home/ec2-user/.kube/config
      register: svc_output

    - debug:
        msg: "{{ svc_output.stdout_lines }}"
