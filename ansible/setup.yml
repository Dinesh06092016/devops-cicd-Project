- name: Setup EC2 instances for Kubernetes
  hosts: all
  become: yes

  tasks:
    - name: Ensure system is updated (skip broken repos)
      yum:
        name: "*"
        state: latest
        disablerepo: kubernetes    # correct parameter
        skip_broken: yes           # skip broken packages instead of failing

    - name: Install required packages
      yum:
        name:
          - yum-utils
          - device-mapper-persistent-data
          - lvm2
          - git
        state: present

    - name: Add Kubernetes repo
      yum_repository:
        name: kubernetes
        description: Kubernetes
        baseurl: https://packages.cloud.google.com/yum/repos/kubernetes-el7-x86_64
        gpgcheck: yes
        repo_gpgcheck: yes
        gpgkey:
          - https://packages.cloud.google.com/yum/doc/yum-key.gpg
          - https://packages.cloud.google.com/yum/doc/rpm-package-key.gpg
        state: present
        skip_if_unavailable: yes   # Skip if the repo is temporarily down

    - name: Install Kubernetes components
      yum:
        name:
          - kubeadm
          - kubelet
          - kubectl
        state: present
        enablerepo: kubernetes
        skip_broken: yes           # Skip any broken packages
