---
- name: Setup EC2 instances for Kubernetes
  hosts: all
  become: yes
  tasks:

    - name: Gather facts
      ansible.builtin.setup:

    - name: Remove old Kubernetes repo if exists
      ansible.builtin.file:
        path: /etc/yum.repos.d/kubernetes.repo
        state: absent

    - name: Ensure system is updated (skip broken repos)
      ansible.builtin.yum:
        name: '*'
        state: latest
        update_cache: yes
        skip_broken: yes

    - name: Install required packages
      ansible.builtin.yum:
        name:
          - git
          - curl
          - wget
          - vim
          - yum-utils
          - device-mapper-persistent-data
          - lvm2
        state: present

    - name: Enable Kubernetes via amazon-linux-extras
      ansible.builtin.shell: amazon-linux-extras enable kubernetes1.24
      args:
        warn: false

    - name: Install Kubernetes packages
      ansible.builtin.yum:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present

    - name: Enable and start kubelet service
      ansible.builtin.systemd:
        name: kubelet
        enabled: yes
        state: started

    - name: Disable swap (required for Kubernetes)
      ansible.builtin.shell: |
        swapoff -a
        sed -i '/swap/d' /etc/fstab
      args:
        warn: false
