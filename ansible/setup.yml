---
- name: Setup EC2 instances for Kubernetes
  hosts: all
  become: true
  tasks:

    - name: Gather facts
      ansible.builtin.setup:

    - name: Remove old Kubernetes repo if exists
      ansible.builtin.file:
        path: /etc/yum.repos.d/kubernetes.repo
        state: absent

    - name: Ensure system is updated
      ansible.builtin.yum:
        name: "*"
        state: latest
        update_cache: yes
        skip_broken: yes

    - name: Install required packages
      ansible.builtin.yum:
        name:
          - yum-utils
          - device-mapper-persistent-data
          - lvm2
          - curl
          - git
          - bash-completion
          - conntrack
          - socat
        state: present

    - name: Add Kubernetes repo for Amazon Linux 2 (EL8)
      ansible.builtin.get_url:
        url: https://packages.cloud.google.com/yum/repos/kubernetes-el8-x86_64/kubernetes.repo
        dest: /etc/yum.repos.d/kubernetes.repo
        mode: '0644'

    - name: Refresh yum cache after adding Kubernetes repo
      ansible.builtin.yum:
        name: "*"
        state: latest
        update_cache: yes

    - name: Disable swap (required for Kubernetes)
      ansible.builtin.shell: |
        swapoff -a
        sed -i '/swap/d' /etc/fstab

    - name: Enable Kubernetes via amazon-linux-extras
      ansible.builtin.shell: amazon-linux-extras enable kubernetes1.27

    - name: Install Docker
      ansible.builtin.yum:
        name: docker
        state: present

    - name: Enable and start Docker service
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true
